# The only chip with enough full UARTs for four doors, and the one that shows
# a single image serving two drive generations at once: hcp2 on two ports,
# hcp1 on the other two.
esphome:
  name: hcpbridge-p4

external_components:
  - source:
      type: local
      path: "../../components/"

esp32:
  variant: esp32p4
  framework:
    type: esp-idf

logger:
  level: WARN
  baud_rate: 0

hcpbridge:
  - id: door_a
    uart_num: 1
    rx_pin: 4
    tx_pin: 5
  - id: door_b
    uart_num: 2
    rx_pin: 6
    tx_pin: 7
    protocol: hcp1
  - id: door_c
    uart_num: 3
    rx_pin: 8
    tx_pin: 9
  - id: door_d
    uart_num: 4
    rx_pin: 10
    tx_pin: 11
    protocol: hcp1

cover:
  - platform: hcpbridge
    hcpbridge_id: door_a
    name: Door A
    device_class: garage
  - platform: hcpbridge
    hcpbridge_id: door_b
    name: Door B
    device_class: garage
